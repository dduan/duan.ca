name: Generator

on:
  push:
    paths:
    - 'generator/**'
  pull_request:
    paths:
    - 'generator/**'

jobs:
  macOS:
    name: Darwin Generator Tests
    runs-on: macOS-latest
    strategy:
      matrix:
        action:
          - cd generator; make test
    steps:
    - uses: actions/checkout@v1
    - name: Action
      run: ${{ matrix.action }}
  ubuntu:
    name: Linux x86_64 Generator Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        action:
          - cd generator; make test
    steps:
    - uses: actions/checkout@v1
    - name: Action
      run: ${{ matrix.action }}
  ubuntu-arm:
    name: Linux aarch64 Generator Tests
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        action:
          - cd generator; make test
    steps:
    - uses: actions/checkout@v4
    - name: Action
      run: ${{ matrix.action }}
